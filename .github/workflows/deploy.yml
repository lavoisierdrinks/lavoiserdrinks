name: Publish Lavoisier Drinks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site package
        uses: actions/checkout@v4
      - name: Extract the static site
        run: |
          mkdir -p _site
          unzip -q lavoisier-drinks-github.zip -d _site
          test -f _site/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy the site
        id: deployment
        uses: actions/deploy-pages@v4
